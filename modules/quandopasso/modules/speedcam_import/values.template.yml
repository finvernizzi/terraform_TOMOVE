# https://crontab.guru/ from crontabs


# This **strictly** binds the importer to a specific domain (tenant in quandopasso)
domain: ${domain}
namespace: ${namespace}

# FIXED_CAMERAS | MOBILE_CAMERAS
action: 'FIXED_CAMERAS'
broker:
  # AMQP host name without protocol and port. <name>.<namespace>.svc.cluster.local 
  # Queue user is hardcoded in the template
  host: "amqp"
  namespace: "common"
  vhost: ${domain}
  exchange: ${domain}


# Seconds to wait before declare the proces closed
wait_before_close: "180"

avs_radius: ${avs_radius}
avs_anticipate: ${avs_anticipate}

# These configurations are common in areas
areas_configs:
  vsign_from: ${vsign_from}
  publish_vsign: "true"
  cert_file: ${cert_file}
  jku: ${jku}
  kid: ${kid}
  sign: ${sign}
  sign_alg: ${sign_alg}

areas:
  # ---> ID DEVE ESSERE UN NOME VALIDO <---
  - id: Lombardia
    # This defines the area queried to OSM and naming in the installation
    area: Lombardia
    coords: '{"lat": "45.468952703770185", "lng": "9.179087277700223"}'
    debug: 'nlg:*, speed_cam_importer:*'
    http_source_timeout: "3000000"
    # Everyday @00:10
    schedule: "0 * 1 * *"
  - id: Piemonte
    # This defines the area queried to OSM and naming in the installation
    area: Piemonte
    coords: '{"lat": "45.070339", "lng": "7.686864"}'
    debug: 'nlg:*, speed_cam_importer:*'
    http_source_timeout: "3000000"
