osm:
  api_url: https://overpass.kumi.systems/api/interpreter
  query_timeout: "600"


node:
  env: production

labels:
  environment: prod

image:
  repository: ${repository}
  tag: ${tag}
  imagePullPolicy: ${pullPolicy}
  pullSecretName: ${azcr_pullimage_secret_name}
