# Default values for agent-receiver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: ${replicacount}

image:
  repository: ${repository}
  pullPolicy: ${pullPolicy}
  # Overrides the image tag whose default is the chart appVersion.
  tag: ${tag}
  pullSecretName: ${azcr_pullimage_secret_name}

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

serviceMonitorRelease: 'observability'
portName: "agentreceivermetricport"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  # Moved to ingresses
  enabled: false
  className: ""
  annotations: {
    # appgw.ingress.kubernetes.io/backend-path-prefix: /,
    # appgw.ingress.kubernetes.io/ssl-redirect: 'true',
    # cert-manager.io/cluster-issuer: "letsencrypt-prod",
    # kubernetes.io/ingress.class: azure/application-gateway
  }
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: test.quandopasso.eu
      paths:
        - path: /agent-receiver/*
          pathType: ImplementationSpecific
  tls: 
   - secretName: tls-secret-testeu-quandopasso
     hosts:
       - test.quandopasso.eu

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

environment:
  ca_cert: "/home/quandopasso/mtls/certs/cacert.pem"
  server_cert: "/home/quandopasso/mtls/server_certs/prova.it.cert.pem"
  server_key: "/home/quandopasso/mtls/server_certs/prova.it.key.pem"
  helmet: "false"
  port: 3001
  domain: ${domain}
  broker: "amqp.common.svc.cluster.local"
  queue_user: ${queue_user}
  queue_vhost: ${queue_vhost}
  queue_password: ${queue_password}
  queue_exchange: ${queue_exchange}
  customer_name: ${customer_name}
  mtls: "false"
  log: "false"
  api_key: ${api_key}
  api_version: "v1"
  path_folder: "/home/quandopasso/paths"
